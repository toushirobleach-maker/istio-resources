# Native `spec` is supported at every resource location (see README).
# A non-null object, including {}, replaces the generated spec in full.
# Missing/null spec keeps the existing convenience fields below for compatibility.
# Keep name/type outside spec: the chart's resource naming is unchanged.
# Fully native examples: ci/spec.yaml; convenience examples: ci/full.yaml.
#
# destinationrule:
#   - name: api
#     spec:
#       host: api.default.svc.cluster.local
#       exportTo: ["."]
#       workloadSelector:
#         matchLabels:
#           app: istio-ingressgateway
#       trafficPolicy:
#         tls:
#           mode: SIMPLE
#           sni: api.default.svc.cluster.local
#           subjectAltNames: [api.default.svc.cluster.local]
#
# Native spec locations:
# ingress.gateways[].spec / ingress.virtualservice.spec
# egress[].spec / egress[].gateways[].spec / egress[].virtualservice.spec
# destinationrule[].spec / authorizationPolicy[].spec
# peerAuthentication[].spec / requestAuthentication[].spec

# -- Override the chart name (used in resource names and labels).
nameOverride: ""

# -- Namespace for all rendered resources. Defaults to the release namespace.
namespace: ""

# -- Common labels added to every resource.
commonLabels: {}
  # team: platform
  # env: prod

# -- Common annotations added to every resource.
commonAnnotations: {}
  # managed-by: helm

# =============================================================================
# Ingress (Gateway + VirtualService)
# =============================================================================
ingress:
  # name: git
  # hosts:
  #   - git.some.domain
  #   - git.some2.domain
  #
  # # -- Cross-namespace reference: when set, VirtualService refers to the
  # # created gateways as "<gatewayNamespace>/<name>-gateway-<type>".
  # gatewayNamespace: ""
  #
  # gateways:
  #   - type: external                         # type: used in gateway name and auto VS ref
  #     gateway_selector: "istio-ingress-gateway-external"
  #     redirectHttps: true                    # HTTP ports of THIS gateway become HTTPS redirects
  #     ports:
  #       - number: 443
  #         name: https
  #         protocol: HTTPS
  #         tls:
  #           mode: SIMPLE                     # enables HTTPS on this port
  #           serverCertificate: /etc/certs/servercert.pem
  #           privateKey: /etc/certs/privatekey.pem
  #       - number: 80
  #         name: http
  #         protocol: HTTP
  #   - type: internal
  #     gateway_selector: "istio-ingress-gateway-internal"
  #     ports:
  #       - number: 80
  #         name: http
  #         protocol: HTTP
  #
  # virtualservice:
  #   # -- Explicit gateway references. Used only when `ingress.gateways` is empty.
  #   # gateways:
  #   #   - istio-system/my-existing-gateway
  #
  #   # -- Health probe route injected as the first HTTP rule.
  #   health:
  #     enabled: true
  #     host: istio-ingress-gateway            # destination host (default: istio-ingress-gateway)
  #     port: 15021                            # destination port (default: 15021)
  #
  #   http:
  #     - match:
  #         - uri:
  #             prefix: /api
  #       rewrite:
  #         uri: /
  #       route:
  #         - destination:
  #             host: api.default.svc.cluster.local
  #             port:
  #               number: 8080
  #       timeout: 30s
  #       retries:
  #         attempts: 3
  #         perTryTimeout: 5s
  #         retryOn: 5xx,reset
  #       corsPolicy:
  #         allowOrigins:
  #           - exact: https://example.com
  #         allowMethods: [GET, POST]
  #     - route:
  #         - destination:
  #             host: httpbin.default.svc.cluster.local
  #             port:
  #               number: 3000
  #
  #   tcp:
  #     - match:
  #         - port: 27017
  #       route:
  #         - destination:
  #             host: mongo.backup.svc.cluster.local
  #             port:
  #               number: 5555

# =============================================================================
# Egress (ServiceEntry)
# =============================================================================
# egress:
#   - name: google
#     hosts:
#       - www.google.com
#       - google.ru
#     ports:
#       - number: 443
#         name: https
#         protocol: HTTPS
#       - number: 80
#         name: http
#         protocol: HTTP
#     location: MESH_EXTERNAL
#     resolution: DNS
#
#   # -- Route traffic through an Istio egress gateway (e.g. to gitlab.com).
#   # Presence of `gateways` (like ingress) creates the egress Gateway resources
#   # and a VirtualService: mesh -> egress GW -> external host (TLS passthrough).
#   - name: gitlab
#     hosts:
#       - gitlab.com
#     ports:
#       - number: 443
#         name: https
#         protocol: TLS
#     location: MESH_EXTERNAL
#     resolution: DNS
#     gateways:
#       - type: egress                                # Gateway name: gitlab-gateway-egress
#         gateway_selector: "istio-egressgateway"
#         # host: istio-egressgateway.istio-system.svc.cluster.local  # egress GW svc (default)
#         # subset: ""                                               # optional DR subset on the GW host

# =============================================================================
# DestinationRule
# =============================================================================
# destinationrule:
#   - name: my-service
#     host: my-service
#     # exportTo: ["."]                      # limit visibility to this namespace
#     # workloadSelector:                    # limit policy to matching clients in this namespace
#     #   matchLabels:
#     #     app: istio-ingressgateway
#     trafficPolicy:
#       loadBalancer:
#         simple: RANDOM
#       outlierDetection:                      # circuit breaker: eject unhealthy pods
#         consecutive5xxErrors: 5
#         interval: 30s
#         baseEjectionTime: 30s
#       connectionPool:                        # TCP/HTTP pool tuning
#         tcp:
#           maxConnections: 100
#         http:
#           http1MaxPendingRequests: 10
#     subsets:
#       - name: v1
#         labels:
#           version: v1
#       - name: v2
#         labels:
#           version: v2
#         trafficPolicy:
#           loadBalancer:
#             simple: ROUND_ROBIN

