# Regression snapshot of convenience values before native spec support.
# Chart-version labels are excluded; resource identities/specs must stay unchanged.
- apiVersion: security.istio.io/v1beta1
  kind: AuthorizationPolicy
  metadata:
    name: allow-get
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    selector:
      matchLabels:
        app: httpbin
    action: ALLOW
    rules:
    - to:
      - operation:
          methods:
          - GET
- apiVersion: networking.istio.io/v1alpha3
  kind: DestinationRule
  metadata:
    name: my-service-destinationrule
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    host: my-service
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 100
      loadBalancer:
        simple: RANDOM
      outlierDetection:
        consecutive5xxErrors: 5
        interval: 30s
    subsets:
    - labels:
        version: v1
      name: v1
- apiVersion: networking.istio.io/v1alpha3
  kind: DestinationRule
  metadata:
    name: apiserver-ingress-destinationrule
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    host: kubernetes.default.svc.cluster.local
    exportTo:
    - .
    workloadSelector:
      matchLabels:
        app: istio-ingressgateway
    trafficPolicy:
      tls:
        caCertificates: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        mode: SIMPLE
        sni: kubernetes.default.svc.cluster.local
        subjectAltNames:
        - kubernetes.default.svc.cluster.local
- apiVersion: networking.istio.io/v1alpha3
  kind: Gateway
  metadata:
    name: gitlab-gateway-egress
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    selector:
      app: istio-egressgateway
    servers:
    - port:
        number: 443
        name: https
        protocol: TLS
      tls:
        mode: PASSTHROUGH
      hosts:
      - gitlab.com
- apiVersion: networking.istio.io/v1alpha3
  kind: Gateway
  metadata:
    name: git-gateway-external
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    selector:
      app: istio-ingress-gateway-external
    servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        credentialName: git-tls
        mode: SIMPLE
      hosts:
      - git.example.com
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
      - git.example.com
      tls:
        httpsRedirect: true
- apiVersion: security.istio.io/v1beta1
  kind: PeerAuthentication
  metadata:
    name: mesh-mtls
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    mtls:
      mode: STRICT
- apiVersion: security.istio.io/v1beta1
  kind: RequestAuthentication
  metadata:
    name: jwt-auth
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    selector:
      matchLabels:
        app: my-service
    jwtRules:
    - issuer: https://idp.example.com
      jwksUri: https://idp.example.com/.well-known/jwks.json
- apiVersion: networking.istio.io/v1alpha3
  kind: ServiceEntry
  metadata:
    name: google-egress
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    hosts:
    - www.google.com
    ports:
    - number: 443
      name: https
      protocol: HTTPS
    location: MESH_EXTERNAL
    resolution: DNS
- apiVersion: networking.istio.io/v1alpha3
  kind: ServiceEntry
  metadata:
    name: gitlab-egress
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    hosts:
    - gitlab.com
    ports:
    - number: 443
      name: https
      protocol: TLS
    location: MESH_EXTERNAL
    resolution: DNS
- apiVersion: networking.istio.io/v1alpha3
  kind: VirtualService
  metadata:
    name: gitlab-egress-virtualservice
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    hosts:
    - gitlab.com
    gateways:
    - mesh
    - gitlab-gateway-egress
    tls:
    - match:
      - port: 443
        sniHosts:
        - gitlab.com
        gateways:
        - mesh
      route:
      - destination:
          host: istio-egressgateway.istio-system.svc.cluster.local
          port:
            number: 443
    - match:
      - port: 443
        sniHosts:
        - gitlab.com
        gateways:
        - gitlab-gateway-egress
      route:
      - destination:
          host: gitlab.com
          port:
            number: 443
- apiVersion: networking.istio.io/v1alpha3
  kind: VirtualService
  metadata:
    name: git-virtualservice
    namespace: istio-system
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: test
      app.kubernetes.io/part-of: istio
      app.kubernetes.io/version: '1.0'
      team: platform
    annotations:
      managed-by: helm
  spec:
    hosts:
    - git.example.com
    gateways:
    - git-gateway-external
    http:
    - match:
      - uri:
          prefix: /health
      rewrite:
        uri: /healthz/ready
      route:
      - destination:
          host: istio-ingress-gateway
          port:
            number: 15021
    - fault:
        delay:
          fixedDelay: 1s
          percentage:
            value: 10
      match:
      - uri:
          prefix: /api
      retries:
        attempts: 3
        perTryTimeout: 5s
      rewrite:
        uri: /
      route:
      - destination:
          host: api.default.svc.cluster.local
          port:
            number: 8080
      timeout: 30s
    - route:
      - destination:
          host: httpbin.default.svc.cluster.local
          port:
            number: 3000
